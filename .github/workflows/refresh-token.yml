name: Refresh Instagram token

on:
  schedule:
    - cron: "0 6 1,15 * *" # twice a month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the token and store it
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT secret is not set, so the token is not refreshed automatically."
            exit 0
          fi
          python3 scripts/refresh_token.py "$RUNNER_TEMP/token"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/token"
